<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Caricamento sistema quantistico</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/dark_theme.css') }}">
    </head>
    <body>
        {% include 'fragmenttemplate/header.html' %}
        <br>
        <div class="container">
            <div class="row">
                <div class="col-sm-12">
                    <form enctype="multipart/form-data">
                        <div class="row form-group">        
                            <div class="col-sm text-center" style="border: #000000 solid 1px;">
                                <input type="file" id="file" name="file" accept=".zip" style="display: none;">
                                <input 
                                    type="hidden" 
                                    id="input-lingua" 
                                    value="{{ 'inglese' if session.get('lingua') == 'inglese' else 'italiano' }}"
                                />
                                <button type="button" id="uploadBtn">
                                    {% if session["lingua"] == "inglese": %} 
                                        Select the ZIP file
                                    {% else: %}
                                        Seleziona il file ZIP
                                    {% endif %}
                                </button>
                                <p id="fileName"></p>
                                <pre>
                                    <div class="error-text">{{params['errors']['file']}}</div>
                                </pre>
                            </div>
                        </div>
                        <div class="row form-group">
                            <div class="col-sm-6 text-right">
                                <input type="hidden" name="name_transpilation" id="name_transpilation" value="{{ params['name_transpilation'] }}">
                                <button type="submit" formaction="{{url_for('analysis.loading_q_system')}}" formmethod="post" class="custom-button">
                                    <i class="fa fa-check fa-2x" aria-hidden="true"></i>
                                    <div class="icon-label">
                                        {% if session["lingua"] == "inglese": %} 
                                            Load the quantum system
                                        {% else: %}
                                            Carica il sistema quantistico
                                        {% endif %}
                                    </div>
                                </button>
                            </div>
                            <div class="col-sm-6 text-left">
                                <input type="hidden" name="name_transpilation" id="name_transpilation" value="{{ params['name_transpilation'] }}">
                                <button type="submit" formaction="{{url_for('analysis.display_analysis_area')}}" class="custom-button">
                                    <i class="fa fa-times fa-2x" aria-hidden="true"></i>
                                    <div class="icon-label">
                                        {% if session["lingua"] == "inglese": %} 
                                            Cancel
                                        {% else: %}
                                            Annulla
                                        {% endif %}
                                    </div>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            const fileInput = document.getElementById('file');
            const uploadBtn = document.getElementById('uploadBtn');
            const fileNameDisplay = document.getElementById('fileName');
            var lingua = document.querySelector("#input-lingua").value;

            // Quando clicchi sul bottone, apri il file input
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });

            // Quando l'utente seleziona un file, mostra il nome
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = (lingua === "italiano" ? "File selezionato: " : "File selected: ") + fileInput.files[0].name;
                } else {
                fileNameDisplay.textContent = '';
                }
            });
        </script>
    </body>
</html>
